name: Daily Morning Briefing

on:
  schedule:
    # 0분 대신 17분이나 34분처럼 애매한 시간으로 변경 (KST 오전 8시 17분)
    - cron: '17 23 * * *'
  workflow_dispatch: # 수동 실행 버튼을 활성화합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 최신 노드 버전 대응

      - name: Set up Python
        uses: actions/setup-python@v5 # 최신 노드 버전 대응
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI google-generativeai pytz

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
